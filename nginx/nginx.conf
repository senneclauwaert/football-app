# Redirect all HTTP to HTTPS
server {
    listen 80;
    server_name footballapprelegem.duckdns.org;

    # Required for certbot webroot renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — main server block
server {
    listen 443 ssl;
    server_name footballapprelegem.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/footballapprelegem.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/footballapprelegem.duckdns.org/privkey.pem;

    # Recommended TLS settings
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    # Increase body size limit for file uploads (shop images, etc.)
    client_max_body_size 20M;

    # Use Docker's internal DNS so upstream IPs are re-resolved after rebuilds
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API — proxy to FastAPI backend
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass         $backend_upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Everything else — proxy to the built React container
    location / {
        set $frontend_upstream http://frontend:80;
        proxy_pass         $frontend_upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
